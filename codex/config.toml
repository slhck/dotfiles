# Shared Codex defaults; project trust and app integrations stay local.
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "high"
personality = "pragmatic"
service_tier = "default"

[features]
hooks = true
memories = true
js_repl = false

[notice]
hide_rate_limit_model_nudge = true

[tui]
status_line = ["model-with-reasoning", "current-dir", "thread-name", "used-tokens", "context-window-size"]
status_line_use_colors = true
